name: reedpill
description: AI-powered text-based relationship advisor (Red Pill philosophy).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Typography (Cairo/Tajawal for Arabic, Orbitron for Latin)
  google_fonts: ^6.2.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Splash video
  video_player: ^2.9.2

  # Monetization
  google_mobile_ads: ^5.1.0
  app_tracking_transparency: ^2.0.7

  # AI
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
